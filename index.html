<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Library Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0ea;
      --card-bg: #fffdf9;
      --accent: #8b5e3c;
      --saksham-accent: #2c5e50;
      --neelam-accent: #8c3a50;
      --text: #2f2a24;
      --muted: #82786e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(#dfd7cc 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      padding: 30px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 650px; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-family: 'Playfair Display', serif; font-size: 2.1rem; color: var(--accent); }
    header p { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }

    .composer {
      background: var(--card-bg);
      border: 1px solid #e2dacd;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
      margin-bottom: 35px;
    }
    .author-select {
      display: flex;
      gap: 15px;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .author-select label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
    textarea {
      width: 100%;
      height: 110px;
      border: 1px solid #d9d0c3;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      background: #faf8f5;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tools { display: flex; gap: 8px; }
    .btn-tool {
      background: #eee7dc;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .notes-list { display: flex; flex-direction: column; gap: 20px; }
    .note-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 22px;
      border: 1px solid #e7ded2;
      box-shadow: 0 6px 15px rgba(0,0,0,0.03);
      position: relative;
    }
    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px dashed #dcd3c5;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .sender { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; }
    .sender.Saksham { color: var(--saksham-accent); }
    .sender.Neelam { color: var(--neelam-accent); }
    .timestamp { font-size: 0.75rem; color: var(--muted); }
    .note-content {
      font-family: 'Caveat', cursive;
      font-size: 1.45rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .note-media { margin-top: 14px; }
    .note-media img { max-width: 100%; border-radius: 8px; }
    audio { width: 100%; margin-top: 12px; height: 36px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>The Library Desk</h1>
    <p>A quiet place for shared notes & thoughts.</p>
  </header>

  <div class="composer">
    <div class="author-select">
      <span>Who is writing?</span>
      <label><input type="radio" name="author" value="Neelam" checked> Neelam</label>
      <label><input type="radio" name="author" value="Saksham"> Saksham</label>
    </div>
    <textarea id="noteText" placeholder="Write a note..."></textarea>
    <div class="composer-actions">
      <div class="tools">
        <input type="file" id="mediaUpload" accept="image/*" style="display:none;" />
        <button type="button" class="btn-tool" onclick="document.getElementById('mediaUpload').click()">+ Photo</button>
        <button type="button" class="btn-tool" id="recordBtn">🎙 Record</button>
        <span id="recordStatus" style="font-size:0.8rem; color:var(--muted); align-self:center;"></span>
      </div>
      <button type="button" class="btn-submit" id="sendBtn">Send Note</button>
    </div>
  </div>

  <div class="notes-list" id="notesList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDqRjbss28gFR-3e9hvcvmAx5khdaEa-Dg",
    authDomain: "notes-4ead8.firebaseapp.com",
    projectId: "notes-4ead8",
    storageBucket: "notes-4ead8.firebasestorage.app",
    messagingSenderId: "836166117110",
    appId: "1:836166117110:web:fb92e45512cb4bff96aed7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let mediaRecorder;
  let audioChunks = [];
  let base64Audio = null;
  const recordBtn = document.getElementById("recordBtn");
  const recordStatus = document.getElementById("recordStatus");

  recordBtn.onclick = async () => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            base64Audio = reader.result;
            recordStatus.innerText = "Voice clip saved";
            recordBtn.innerText = "Re-record";
          };
        };
        mediaRecorder.start();
        recordStatus.innerText = "Listening...";
        recordBtn.innerText = "Stop";
      } catch (err) {
        alert("Please allow microphone access to record.");
      }
    } else if (mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    }
  };

  document.getElementById("sendBtn").onclick = async () => {
    const text = document.getElementById("noteText").value.trim();
    const author = document.querySelector('input[name="author"]:checked').value;
    const file = document.getElementById("mediaUpload").files[0];

    if (!text && !file && !base64Audio) return;

    let base64Image = null;
    if (file) {
      base64Image = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    try {
      await addDoc(collection(db, "notes"), {
        author,
        text,
        mediaUrl: base64Image,
        audioUrl: base64Audio,
        createdAt: new Date()
      });

      document.getElementById("noteText").value = "";
      document.getElementById("mediaUpload").value = "";
      base64Audio = null;
      recordStatus.innerText = "";
      recordBtn.innerText = "🎙 Record";
    } catch (e) {
      console.error("Error adding document: ", e);
    }
  };

  const notesQuery = query(collection(db, "notes"), orderBy("createdAt", "desc"));
  onSnapshot(notesQuery, snapshot => {
    const container = document.getElementById("notesList");
    container.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('en-GB', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
      
      let html = `
        <div class="note-card">
          <div class="note-header">
            <span class="sender ${data.author}">${data.author}</span>
            <span class="timestamp">${dateStr}</span>
          </div>
          ${data.text ? `<div class="note-content">${data.text}</div>` : ''}
          ${data.mediaUrl ? `<div class="note-media"><img src="${data.mediaUrl}" loading="lazy"/></div>` : ''}
          ${data.audioUrl ? `<audio controls src="${data.audioUrl}"></audio>` : ''}
        </div>
      `;
      container.innerHTML += html;
    });
  });
</script>
</body>
</html>
